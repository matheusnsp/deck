<!doctype html>
<html lang="pt-BR" data-tema="preto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deck">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<title>Deck</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="stylesheet" href="teclas.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topo">
    <h1 id="nome">Deck</h1>
    <button class="ficha-foco" type="button" hidden><span class="ficha-icone"></span><span class="ficha-tempo"></span></button>
    <button class="mini-player" type="button" hidden><img alt=""><span class="eq"><i></i><i></i><i></i></span><span class="mini-titulo"></span></button>
    <button id="avisos" class="avisos" type="button" hidden></button>
    <div id="status" class="status tentando" role="status"><i></i><span data-t>Conectando…</span></div>
    <button class="tela-cheia" type="button" hidden aria-label="Tela cheia">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="abrir" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="fechar" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
    </button>
  </header>

  <main id="palco">
    <div id="grade" class="grade"></div>
    <div id="vazio" class="vazio" hidden></div>
  </main>

  <nav id="rodape" hidden>
    <div id="bancos" class="bancos"></div>
  </nav>
</div>

<div id="cantinho" class="cantinho">
  <span id="status-mini" class="status-mini tentando" role="status"></span>
  <button class="mini-player" type="button" hidden><img alt=""><span class="eq"><i></i><i></i><i></i></span></button>
  <button class="ficha-foco" type="button" hidden><span class="ficha-icone"></span><span class="ficha-tempo"></span></button>
  <button class="tela-cheia" type="button" hidden aria-label="Tela cheia">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="abrir" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="fechar" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
  </button>
</div>

<div id="dica" class="dica" hidden>
  <p id="dica-texto"></p>
  <button type="button" id="dica-fechar" aria-label="Fechar dica">✕</button>
</div>

<div id="folha" class="folha" hidden>
  <div class="folha-caixa">
    <h2 data-t>Avisos dos botões</h2>
    <ul id="folha-lista" class="rolavel"></ul>
    <p class="folha-nota" data-t>Corrija no editor do computador — o celular atualiza sozinho.</p>
    <button type="button" id="folha-ok" data-t>Entendi</button>
  </div>
</div>

<div id="foco" class="foco" hidden>
  <div class="foco-caixa">
    <div class="foco-relogio">
      <svg class="foco-anel" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="foco-trilho" cx="60" cy="60" r="52" pathLength="100"></circle>
        <circle class="foco-progresso" cx="60" cy="60" r="52" pathLength="100"></circle>
      </svg>
      <div class="foco-tempo">0:00</div>
    </div>
    <div class="foco-lado">
      <div class="foco-icone"></div>
      <div class="foco-titulo"></div>
      <div class="foco-acoes">
        <button type="button" data-foco="pausar" data-t>Pausar</button>
        <button type="button" data-foco="mais5" data-t>+5 min</button>
        <button type="button" data-foco="encerrar" class="perigo" data-t>Encerrar</button>
      </div>
      <button type="button" class="foco-minimizar" data-t>Minimizar</button>
    </div>
  </div>
</div>

<div id="chamada" class="chamada" role="alert" hidden>
  <div class="chamada-icone" aria-hidden="true">📞</div>
  <div class="chamada-textos"><b class="chamada-quem"></b><span class="chamada-detalhe"></span></div>
  <button type="button" data-chamada="recusar" class="recusar" data-t>Recusar</button>
  <button type="button" data-chamada="atender" class="atender" data-t>Atender</button>
</div>

<div id="toast" class="toast" role="alert"></div>

<script src="idioma.js"></script>
<script src="icones.js"></script>
<script src="tom.js"></script>
<script src="app.js"></script>
</body>
</html>
